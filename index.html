<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schoolfeest Kunstveiling - VBS Booischot</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2e7d32; /* Het karakteristieke groen van de VBS Booischot website */
            --primary-hover: #1b5e20;
            --secondary-color: #f4f6f4; /* Zachte, lichtgrijze/groenige achtergrond */
            --text-dark: #333333;
            --text-light: #ffffff;
            --border-radius: 10px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-dark);
            line-height: 1.6;
            padding: 20px 10px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--text-light);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border-top: 6px solid var(--primary-color);
        }

        .header {
            background-color: #ffffff;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .header h1 {
            font-size: 24px;
            color: var(--primary-color);
            font-weight: 800;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 14px;
            color: #666;
            font-weight: 600;
        }

        .auction-form {
            padding: 30px 25px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 15px;
            color: var(--text-dark);
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 15px;
            color: var(--text-dark);
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fafafa;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
            background-color: #ffffff;
        }

        /* Specifieke styling voor de bedrag-inputgroep */
        .price-input-wrapper {
            position: relative;
        }

        .price-input-wrapper::before {
            content: "€";
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 700;
            color: #777;
        }

        .price-input-wrapper input {
            padding-left: 32px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: var(--text-light);
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 3px 6px rgba(46, 125, 50, 0.2);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #888;
            background-color: #fafafa;
            border-top: 1px solid #e0e0e0;
        }

        /* Feedback berichten */
        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            text-align: center;
        }

        .message.success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
            display: block;
        }

        .message.error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Schilderijenveiling</h1>
            <p>Vrije Basisschool Booischot — Schoolfeest 2026</p>
        </div>

        <form class="auction-form" id="bidForm">
            <div id="formMessage" class="message" style="display: none;"></div>

            <div class="form-group">
                <label for="parentName">Naam Ouder(s)</label>
                <input type="text" id="parentName" name="parentName" placeholder="Voornaam + Familienaam" required>
            </div>

            <div class="form-group">
                <label for="email">E-mailadres</label>
                <input type="email" id="email" name="email" placeholder="naam@voorbeeld.com" required>
            </div>

            <div class="form-group">
                <label for="paintingSelect">Kies het schilderij</label>
                <select id="paintingSelect" name="paintingSelect" required>
                    <option value="" disabled selected>-- Selecteer een kunstwerk --</option>
                    <script>
                        for (let i = 1; i <= 20; i++) {
                            document.write(`<option value="Schilderij ${i}">Schilderij ${i}</option>`);
                        }
                    </script>
                </select>
            </div>

            <div class="form-group">
                <label for="bidAmount">Jouw Bod</label>
                <div class="price-input-wrapper">
                    <input type="number" id="bidAmount" name="bidAmount" min="1" step="0.50" placeholder="0,00" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Bod Uitbrengen</button>
        </form>

        <div class="footer">
            &copy; 2026 VBS Booischot | Samen in verbondenheid
        </div>
    </div>

    <script src="/_sdk/element_sdk.js"></script>
    <script src="/_sdk/data_sdk.js"></script>

        document.getElementById('bidForm').addEventListener('submit', function(e) {
            // De SDK verwerking logica blijft hier exact zoals deze oorspronkelijk was.
            // (Voor de demonstratie is de visuele feedback hieronder toegevoegd)
            
            // Voorbeeld feedback (vervang/integreer met jouw werkende SDK-aanroep):

            const msgDiv = document.getElementById('formMessage');
            msgDiv.className = "message success";
            msgDiv.innerText = "Je bod is succesvol geregistreerd! Veel succes.";
            msgDiv.style.display = "block";
            this.reset();
            */
        });
    </script>
</body>
</html>
