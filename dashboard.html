<!DOCTYPE html>
<html lang="nl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Status - Schoolfeest Veiling</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Nunito Sans', sans-serif; }
    .pulse-green { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body class="bg-stone-50 text-gray-800 min-h-full p-4 sm:p-8">

  <div class="max-w-5xl mx-auto">
    <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 flex flex-col sm:flex-row items-center justify-between gap-4 border-b-2 border-gray-100">
      <div class="flex items-center gap-4">
        <div class="bg-green-50 p-3 rounded-xl text-[#2e7d32] border border-green-100">
          <i data-lucide="gavel" class="w-8 h-8"></i>
        </div>
        <div>
          <h1 class="text-2xl font-extrabold text-gray-900">Actuele Hoogste Bieders</h1>
          <p class="text-sm text-gray-500 font-semibold">Live overzicht Kunstveiling — VBS Booischot</p>
        </div>
      </div>
      <div class="flex items-center gap-2 bg-green-50 text-[#2e7d32] px-4 py-2 rounded-full border border-green-200 text-sm font-bold">
        <span class="w-2 h-2 rounded-full bg-[#2e7d32] pulse-green"></span>
        Live-update actief
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
      <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
        <p class="text-xs text-gray-400 font-bold uppercase tracking-wider">Totaal Opgebracht</p>
        <p id="stat-total" class="text-3xl font-black text-[#2e7d32]">€ 0</p>
      </div>
      <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
        <p class="text-xs text-gray-400 font-bold uppercase tracking-wider">Aantal Biedingen</p>
        <p id="stat-bids" class="text-3xl font-black text-blue-600">0</p>
      </div>
      <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
        <p class="text-xs text-gray-400 font-bold uppercase tracking-wider">Hoogste Enkelvoudige Bod</p>
        <p id="stat-highest" class="text-3xl font-black text-emerald-600">€ 0</p>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-gray-100">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-[#2e7d32] text-white text-sm font-bold uppercase tracking-wider">
              <th class="p-4">Schilderij</th>
              <th class="p-4">Klas / Kunstenaar</th>
              <th class="p-4">Hoogste Bieder</th>
              <th class="p-4 text-right">Actueel Bod</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-gray-100 text-sm">
            <tr>
              <td colspan="4" class="p-8 text-center text-gray-400 font-bold">
                <div class="flex items-center justify-center gap-2">
                  <i data-lucide="loader-2" class="w-5 h-5 animate-spin text-[#2e7d32]"></i>
                  Biedingen ophalen...
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz0Hhm57QavINrPfva6jFs9bNdsoicw1Hqsc3ZfOGXW5JFGR50gnc2trGHdaa5iTBH_/exec";
    
    const PAINTINGS = [
      { id: 'p1', name: 'Werk 1', class: 'Bloemenklas', start: 5 },
      { id: 'p2', name: 'Werk 2', class: 'Vosjesklas', start: 5 },
      { id: 'p3', name: 'Werk 3', class: 'Jip en Jannekeklas 1', start: 5 },
      { id: 'p4', name: 'Werk 4', class: 'Rupsen- en vlinderklas', start: 5 },
      { id: 'p5', name: 'Werk 5', class: 'Julesklas 1', start: 5 },
      { id: 'p6', name: 'Werk 6', class: 'Julesklas 2', start: 5 },
      { id: 'p7', name: 'Werk 7', class: 'Nellie en Cezarklas 1', start: 5 },
      { id: 'p8', name: 'Werk 8', class: 'Nellie en Cezarklas 2', start: 5 },
      { id: 'p9', name: 'Werk 9', class: 'Jip en Jannekeklas 2', start: 5 },
      { id: 'p10', name: 'Werk 10', class: 'L1a', start: 5 },
      { id: 'p11', name: 'Werk 11', class: 'L1b', start: 5 },
      { id: 'p12', name: 'Werk 12', class: 'L2a', start: 5 },
      { id: 'p13', name: 'Werk 13', class: 'L2b', start: 5 },
      { id: 'p14', name: 'Werk 14', class: 'L3', start: 5 },
      { id: 'p15', name: 'Werk 15', class: 'L4', start: 5 },
      { id: 'p16', name: 'Werk 16', class: 'L5a', start: 5 },
      { id: 'p17', name: 'Werk 17', class: 'L5b', start: 5 },
      { id: 'p18', name: 'Werk 18', class: 'L6a', start: 5 },
      { id: 'p19', name: 'Werk 19', class: 'L6b', start: 5 }
    ];

    async function fetchLiveDashboard() {
      try {
        const response = await fetch(SCRIPT_URL);
        const result = await response.json();
        if (result.isOk) {
          renderTable(result.data);
        }
      } catch (error) {
        console.error("Fout bij laden dashboard:", error);
      }
    }

    function renderTable(validBids) {
      const highestBidsMap = {};
      validBids.forEach(bid => {
        const pId = bid.painting_id;
        if (!highestBidsMap[pId] || Number(bid.bid_amount) > Number(highestBidsMap[pId].bid_amount)) {
          highestBidsMap[pId] = bid;
        }
      });

      let totaalOpbrengst = 0;
      let hoogsteEnkelBod = 0;
      const tbody = document.getElementById('table-body');
      
      tbody.innerHTML = PAINTINGS.map(p => {
        const topBid = highestBidsMap[p.id];
        const heeftBiedingen = !!topBid;
        const actueelBedrag = heeftBiedingen ? Number(topBid.bid_amount) : p.start;
        const biederNaam = heeftBiedingen ? `${topBid.bidder_firstname} ${topBid.bidder_lastname[0]}.` : '<span class="text-gray-400 italic font-normal">Nog geen bod</span>';
        
        totaalOpbrengst += actueelBedrag;
        if (heeftBiedingen && actueelBedrag > hoogsteEnkelBod) hoogsteEnkelBod = actueelBedrag;

        return `
          <tr class="hover:bg-green-50/30 transition-colors ${heeftBiedingen ? 'bg-white font-bold text-gray-900' : 'bg-gray-50/50'}">
            <td class="p-4 text-[#2e7d32]">${p.name}</td>
            <td class="p-4 text-gray-600 font-semibold">${p.class}</td>
            <td class="p-4 text-sm">${biederNaam}</td>
            <td class="p-4 text-right font-black text-base ${heeftBiedingen ? 'text-[#2e7d32]' : 'text-gray-400'}">
              € ${actueelBedrag}
            </td>
          </tr>
        `;
      }).join('');

      document.getElementById('stat-total').textContent = `€ ${totaalOpbrengst}`;
      document.getElementById('stat-bids').textContent = validBids.length;
      document.getElementById('stat-highest').textContent = `€ ${hoogsteEnkelBod}`;
      lucide.createIcons();
    }

    fetchLiveDashboard();
    setInterval(fetchLiveDashboard, 10000); // Ververs elke 10 seconden
  </script>
</body>
</html>
